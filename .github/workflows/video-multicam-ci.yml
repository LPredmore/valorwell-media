name: BTY Multi-Camera CI
on:
  pull_request:
    paths:
      - "workers/video-multicam/**"
      - ".github/workflows/video-multicam-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/video-multicam/**"
      - ".github/workflows/video-multicam-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio/video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install webrtcvad-wheels requests "opencv-python-headless==4.10.0.84" "numpy==2.1.3"
      - name: Syntax checks
        run: python -m compileall -q workers/video-multicam
      - name: Run actual dual-camera FFmpeg integration tests
        working-directory: workers/video-multicam
        run: python -m unittest -v test_core.py test_guest_portrait.py
