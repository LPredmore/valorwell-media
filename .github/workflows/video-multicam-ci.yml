name: BTY Multi-Camera CI
on:
  pull_request:
    paths:
      - "workers/video-multicam/**"
      - "supabase/functions/video-bty-nightly-gate/**"
      - "supabase/functions/video-bty-text-dispatcher/**"
      - "supabase/functions/video-thumbnail-generation-dispatcher/**"
      - "supabase/functions/video-multicam-worker-api/**"
      - "supabase/migrations/*multi_guest_thumbnail_identity.sql"
      - "supabase/tests/fixtures/multi_guest_claim_baseline.sql"
      - "scripts/test-multi-guest-queue.mjs"
      - ".github/workflows/video-multicam-ci.yml"
  push:
    branches: [main]
    paths:
      - "workers/video-multicam/**"
      - "supabase/functions/video-bty-nightly-gate/**"
      - "supabase/functions/video-bty-text-dispatcher/**"
      - "supabase/functions/video-thumbnail-generation-dispatcher/**"
      - "supabase/functions/video-multicam-worker-api/**"
      - "supabase/migrations/*multi_guest_thumbnail_identity.sql"
      - "supabase/tests/fixtures/multi_guest_claim_baseline.sql"
      - "scripts/test-multi-guest-queue.mjs"
      - ".github/workflows/video-multicam-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio/video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install webrtcvad-wheels requests "opencv-python-headless==4.10.0.84" "numpy==2.1.3"
      - name: Syntax checks
        run: python -m compileall -q workers/video-multicam
      - name: Run actual dual-camera FFmpeg integration tests
        working-directory: workers/video-multicam
        run: python -m unittest discover -p "test_*.py" -v

  nightly-gate-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate nightly gate TypeScript
        run: deno check --node-modules-dir=auto supabase/functions/video-bty-nightly-gate/index.ts
      - name: Unit-test isolated camera speaker identities
        run: deno test supabase/functions/video-bty-text-dispatcher/speaker-identity.test.ts
      - name: Type-check BTY text dispatcher
        run: deno check --node-modules-dir=auto supabase/functions/video-bty-text-dispatcher/index.ts
      - name: Type-check BTY thumbnail generator
        run: deno check --node-modules-dir=auto supabase/functions/video-thumbnail-generation-dispatcher/index.ts

      - name: Type-check guest reference worker API
        run: deno check --node-modules-dir=auto supabase/functions/video-multicam-worker-api/index.ts

  guest-reference-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise migration and queue contracts in isolated PostgreSQL
        run: |
          validation_dir=$(mktemp -d)
          npm install --prefix "$validation_dir" --save-exact @electric-sql/pglite@0.5.11
          PGLITE_MODULE="$validation_dir/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-multi-guest-queue.mjs
