name: BTY Guest Reference Extraction
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: bty-guest-reference-extraction
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-video face extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg cmake
          python -m pip install 'requests==2.32.5' 'opencv-python-headless==4.10.0.84' 'numpy==1.26.4' 'dlib==19.24.6' 'face-recognition==1.3.0' 'face-recognition-models==0.3.0' 'webrtcvad-wheels==2.0.14.post1' 'setuptools==75.8.2'
      - name: Extract one episode's independent guest references
        env:
          SUPABASE_URL: https://ahqauomkgflopxgnlndd.supabase.co
        run: python workers/video-multicam/guest_reference_worker.py
