name: Video Short Render Worker

on:
  schedule:
    - cron: "1-59/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "video-short-render-triggers/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: video-short-render-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          TOKEN_JSON="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=valorwell-video-worker")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${TOKEN_JSON}")"
          echo "::add-mask::${OIDC_TOKEN}"
          echo "GITHUB_OIDC_TOKEN=${OIDC_TOKEN}" >> "${GITHUB_ENV}"

      - name: Render queued Shorts
        env:
          SUPABASE_URL: https://ahqauomkgflopxgnlndd.supabase.co
          WORKSPACE_ROOT: ${{ runner.temp }}/video-short-render
        run: |
          mkdir -p "${WORKSPACE_ROOT}"
          python workers/video-short-render/app.py
