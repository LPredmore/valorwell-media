name: BTY Multi-Camera Render
on:
  # Exactly 4:00 PM America/Chicago every day (CDT/CST, DST-aware).
  # GitHub's native timezone schedule eliminates duplicate UTC slots.
  # Do not gate execution by the actual runner clock: GitHub can start late.
  schedule:
    - cron: "0 16 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      folder_id:
        description: "Google Drive episode subfolder ID"
        required: true
        type: string
      preview_seconds:
        description: "Preview duration (0 = complete master, 180 = three-minute test)"
        required: true
        default: "180"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bty-multicam-one-episode
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install "requests==2.32.5" "webrtcvad-wheels==2.0.14.post1" "opencv-python-headless==4.10.0.84" "numpy==2.1.3"
      - name: Resolve input
        env:
          DISPATCH_FOLDER: ${{ inputs.folder_id }}
          DISPATCH_PREVIEW: ${{ inputs.preview_seconds }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "SOURCE_FOLDER_ID=$DISPATCH_FOLDER" >> "$GITHUB_ENV"
            echo "PREVIEW_SECONDS=$DISPATCH_PREVIEW" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            echo "SOURCE_FOLDER_ID=" >> "$GITHUB_ENV"
            echo "PREVIEW_SECONDS=0" >> "$GITHUB_ENV"
          else
            echo "Unsupported workflow event: $EVENT_NAME" >&2
            exit 1
          fi
      - name: Render isolated-audio multi-camera episode
        env:
          SUPABASE_URL: https://ahqauomkgflopxgnlndd.supabase.co
          WORKSPACE_ROOT: ${{ runner.temp }}/video-multicam
        run: |
          python workers/video-multicam/worker.py
